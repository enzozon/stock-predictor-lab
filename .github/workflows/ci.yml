name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # O projeto usa layout flat (api/, backtest/, models/...), sem build-system
      # configurado — instalar as dependências direto do pyproject evita duplicar
      # a lista aqui e sair do sincronismo quando ela mudar.
      - name: Instalar dependências
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; open('requirements-ci.txt','w').write('\n'.join(deps))"
          pip install -r requirements-ci.txt pytest

      - name: Testes (pytest)
        run: pytest
